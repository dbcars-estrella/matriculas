<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Matrícula">
<meta name="theme-color" content="#0B3D91">
<title>Año de matriculación</title>
<style>
:root{--bg:#E6E9EC;--ink:#1B2025;--mute:#56616B;--blue:#0B3D91;--card:#fff;--line:#C6CED5;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#14181C;--ink:#EEF1F3;--mute:#93A0AB;--card:#1E242A;--line:#323B43}}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,"Helvetica Neue",Arial,sans-serif;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px calc(env(safe-area-inset-bottom,0px) + 28px)}
main{max-width:460px;margin:0 auto}
h1{font-size:28px;line-height:1.15;margin:0 0 6px;letter-spacing:-.01em}
.sub{margin:0 0 22px;color:var(--mute)}
.plate{display:flex;height:76px;border:3px solid #111;border-radius:10px;background:#fff;overflow:hidden}
.eu{width:46px;background:var(--blue);color:#fff;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;font-weight:700;font-size:15px}
.plate input{flex:1;min-width:0;border:0;outline:0;background:#fff;color:#111;text-align:center;font:800 36px "DIN Alternate","Arial Narrow","Helvetica Neue",Arial,sans-serif;letter-spacing:.08em;text-transform:uppercase;border-radius:0}
.plate input::placeholder{color:#B5BBC1}
.plate:focus-within{box-shadow:0 0 0 3px var(--blue)}
button{width:100%;margin-top:14px;height:54px;border:0;border-radius:12px;background:var(--blue);color:#fff;font:600 18px -apple-system,Arial,sans-serif}
button:active{filter:brightness(1.15)}
.cam{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px;background:transparent;color:var(--blue);border:2px solid var(--blue)}
.cam svg{width:24px;height:24px}
@media(prefers-color-scheme:dark){.cam{color:#8DB4FF;border-color:#8DB4FF}}
.card .nota{margin-top:12px;font-size:15px;color:var(--mute)}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#out{margin-top:22px;min-height:120px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.year{font-size:64px;line-height:1;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;color:var(--blue)}
@media(prefers-color-scheme:dark){.year{color:#8DB4FF}}
.card p{margin:0}
.err .year{font-size:22px;line-height:1.25;letter-spacing:0;color:var(--ink)}
.foot{margin:22px 0 0;font-size:14px;color:var(--mute)}
</style>
</head>
<body>
<main>
  <h1>Año de matriculación</h1>
  <p class="sub">Escribe la matrícula (formato 0000 BBB) y te digo de qué año es.</p>
  <div class="plate">
    <div class="eu" aria-hidden="true">E</div>
    <input id="m" maxlength="10" autocapitalize="characters" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="1234 BCD" aria-label="Matrícula">
  </div>
  <button id="go" type="button">Ver año</button>
  <button id="cam" class="cam" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>Hacer foto a la matrícula</button>
  <input id="foto" type="file" accept="image/*" capture="environment" hidden>
  <section id="out" aria-live="polite"></section>
  <p class="foot">Es el año de primera matriculación, no el de fabricación. Los datos son orientativos, por series de letras. La foto se lee en tu móvil y no se envía a ningún sitio.</p>
</main>
<script>
// Series de letras por año de matriculación (matrículas desde septiembre de 2000).
// Fuente: tabla de hibridosyelectricos.com (oct. 2026), contrastada con los cambios de letra de El Independiente.
// Nota: la fuente escribe "HBE" como fin de 2010, pero la E no se usa en matrículas; aquí se usa HBD.
const T=[[2000,'BBJ','BDR'],[2001,'BFJ','BRT'],[2002,'BSL','CDC'],[2003,'CDV','CRC'],[2004,'CRV','DFF'],[2005,'DFZ','DVB'],[2006,'DVW','FKC'],[2007,'FKY','FYY'],[2008,'FZR','GKH'],[2009,'GKS','GSR'],[2010,'GTC','HBD'],[2011,'HBP','HHT'],[2012,'HJC','HNK'],[2013,'HNT','HVF'],[2014,'HVN','JBY'],[2015,'JCK','JKZ'],[2016,'JLN','JVZ'],[2017,'JWN','KGN'],[2018,'KHG','KSS'],[2019,'KTJ','LDR'],[2020,'LFH','LMC'],[2021,'LML','LVV'],[2022,'LWD','MDD'],[2023,'MDR','MMN'],[2024,'MNC','MXP'],[2025,'MYF','NJS'],[2026,'NJT','NTJ']];
const AL='BCDFGHJKLMNPRSTVWXYZ';
const ix=s=>{let n=0;for(const c of s){const k=AL.indexOf(c);if(k<0)return -1;n=n*20+k}return n};
const R=T.map(([y,a,b])=>({y,a:ix(a),b:ix(b),ra:a,rb:b}));

function buscar(letras){
  const n=ix(letras);
  if(n<R[0].a)return{y:2000,r:R[0]};
  for(let i=0;i<R.length;i++){
    const r=R[i],nx=R[i+1];
    if(n>=r.a&&n<=r.b)return{y:r.y,r};
    if(nx&&n>r.b&&n<nx.a)return{y:r.y,alt:nx.y};
  }
  if(n<ix('PBB'))return{reciente:true};
  return{nueva:true};
}

function analizar(texto){
  const raw=texto.toUpperCase().replace(/[^A-Z0-9]/g,'');
  const m=raw.match(/^[CR]?(\d{4})([A-Z]{3})$/);
  if(m){
    const l=m[2];
    if(/[AEIOUQ]/.test(l))return{err:'Esa matrícula no existe',det:'No se usan vocales ni la Q (ni la Ñ). Revisa las tres letras.'};
    const b=buscar(l);
    if(b.nueva)return{err:'Serie nueva',det:'Las letras '+l+' son posteriores a la última serie de la tabla.'};
    if(b.reciente)return{y:'2026 o 2027',det:'Las letras '+l+' son una serie muy reciente, posterior a NTJ.'};
    if(b.alt)return{y:b.y+' o '+b.alt,det:'Las letras '+l+' caen justo en el cambio de año. Para saberlo seguro, mira el permiso de circulación.'};
    return{y:String(b.y),det:'Las letras '+l+' caen en la serie de '+b.y+' ('+b.r.ra+' a '+b.r.rb+').'};
  }
  if(/^[A-Z]{1,2}\d{4,6}[A-Z]{0,2}$/.test(raw))
    return{err:'Matrícula anterior a septiembre de 2000',det:'Con letra de provincia no se puede sacar el año: cada provincia avanzaba a su ritmo.'};
  return{err:'No reconozco el formato',det:'Escribe cuatro números y tres letras, por ejemplo 1234 BCD.'};
}

// Lectura de la matrícula a partir de una foto (OCR en el propio móvil con tesseract.js).
const LET='BCDFGHJKLMNPRSTVWXYZ';
function extraer(texto){
  // Las vocales y la Q no existen en las matrículas, así que O, Q e I solo pueden ser cifras mal leídas.
  const t=texto.toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/[OQ]/g,'0').replace(/I/g,'1');
  let m=t.match(/(\d{4})([BCDFGHJKLMNPRSTVWXYZ]{3})/);
  if(m)return m[1]+' '+m[2];
  // Segunda oportunidad: una L en la parte de los números suele ser un 1 mal leído.
  m=t.match(/([0-9L]{4})([BCDFGHJKLMNPRSTVWXYZ]{3})/);
  return m?m[1].replace(/L/g,'1')+' '+m[2]:null;
}
function cargarOCR(){
  return new Promise((ok,ko)=>{
    if(window.Tesseract)return ok();
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
    s.onload=ok;s.onerror=()=>ko(new Error('sin red'));
    document.head.append(s);
  });
}
async function prepararImagen(file){
  const url=URL.createObjectURL(file);
  const img=await new Promise((ok,ko)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=ko;i.src=url});
  const k=Math.min(1,1400/Math.max(img.naturalWidth,img.naturalHeight));
  const c=document.createElement('canvas');
  c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);
  URL.revokeObjectURL(url);
  return c;
}
// Busca la franja azul de la izquierda de la matrícula española: un rectángulo alto y estrecho.
function franjaAzul(data,W,H){
  const m=new Uint8Array(W*H);
  for(let i=0,j=0;j<W*H;i+=4,j++){const r=data[i],g=data[i+1],b=data[i+2];m[j]=(b-r>=40&&b-g>=25&&b>=60)?1:0}
  const lab=new Uint8Array(W*H),pila=new Int32Array(W*H);let best=null;
  for(let s=0;s<W*H;s++){
    if(!m[s]||lab[s])continue;
    let sp=0,x0=W,y0=H,x1=0,y1=0,a=0;pila[sp++]=s;lab[s]=1;
    while(sp){
      const p=pila[--sp],x=p%W,y=(p-x)/W;a++;
      if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y;
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
        const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=W||ny>=H)continue;
        const q=ny*W+nx;if(m[q]&&!lab[q]){lab[q]=1;pila[sp++]=q}
      }
    }
    const w=x1-x0+1,h=y1-y0+1;
    if(h<20||w<4)continue;
    const asp=h/w,fill=a/(w*h);
    if(asp>=1.8&&asp<=6&&fill>=0.55&&(!best||h>best.h))best={x:x0,y:y0,w,h};
  }
  return best;
}
// Recorta solo la zona de números y letras, la amplía y la pasa a blanco y negro.
function recortar(c,f){
  const x0=Math.max(0,Math.round(f.x+f.w)),x1=Math.min(c.width,Math.round(f.x+f.w+4.4*f.h));
  const y0=Math.max(0,Math.round(f.y-0.12*f.h)),y1=Math.min(c.height,Math.round(f.y+f.h+0.12*f.h));
  const pad=20,alto=120,sc=alto/(y1-y0);
  const o=document.createElement('canvas');o.width=Math.round((x1-x0)*sc)+2*pad;o.height=alto+2*pad;
  const g=o.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,o.width,o.height);
  g.imageSmoothingQuality='high';g.drawImage(c,x0,y0,x1-x0,y1-y0,pad,pad,o.width-2*pad,alto);
  const d=g.getImageData(0,0,o.width,o.height),p=d.data,hist=new Array(256).fill(0);
  for(let i=0;i<p.length;i+=4){const y=Math.round(.299*p[i]+.587*p[i+1]+.114*p[i+2]);p[i]=y;hist[y]++}
  const tot=o.width*o.height;let sum=0;for(let i=0;i<256;i++)sum+=i*hist[i];
  let sb=0,wb=0,mx=0,th=127;
  for(let t=0;t<256;t++){wb+=hist[t];if(!wb)continue;const wf=tot-wb;if(!wf)break;sb+=t*hist[t];const mb=sb/wb,mf=(sum-sb)/wf,v=wb*wf*(mb-mf)*(mb-mf);if(v>mx){mx=v;th=t}}
  for(let i=0;i<p.length;i+=4){const v=p[i]>th?255:0;p[i]=p[i+1]=p[i+2]=v}
  g.putImageData(d,0,0);
  return o;
}
// Sabemos que son 4 cifras y 3 letras: se corrige lo que el lector confunde según la posición.
const L2D={O:'0',Q:'0',D:'0',I:'1',L:'1',Z:'2',S:'5',B:'8',G:'6',T:'7',H:'4',A:'4',U:'0',E:'3'};
const D2L={'0':'D','8':'B','5':'S','2':'Z','6':'G','1':'L','7':'T','4':'H','3':'B'};
function corregir(texto){
  const s=texto.toUpperCase().replace(/[^A-Z0-9]/g,'');
  let best=null;
  for(let i=0;i+7<=s.length;i++){
    let out='',cost=0,ok=true;
    for(let k=0;k<7&&ok;k++){
      const ch=s[i+k];
      if(k<4){if(/\d/.test(ch))out+=ch;else if(L2D[ch]){out+=L2D[ch];cost++}else ok=false}
      else{if(LET.includes(ch))out+=ch;else if(D2L[ch]){out+=D2L[ch];cost++}else ok=false}
    }
    if(ok&&(!best||cost<best.cost))best={cost,out};
  }
  return best?best.out.slice(0,4)+' '+best.out.slice(4):null;
}
async function leerFoto(file,avance){
  avance('Cargando el lector…');
  await cargarOCR();
  avance('Preparando la foto…');
  const color=await prepararImagen(file);
  const textos={'loading tesseract core':'Descargando el lector…','initializing tesseract':'Arrancando el lector…','loading language traineddata':'Descargando el idioma…','initializing api':'Arrancando el lector…','recognizing text':'Leyendo la matrícula…'};
  const logger=m=>{
    const t=textos[m.status];
    if(t)avance(t+(m.status==='recognizing text'&&m.progress?' '+Math.round(m.progress*100)+' %':''));
  };
  // El idioma se descarga de un servidor externo; si el primero no responde en 30 s, se prueba con otro.
  let w=null;
  for(const langPath of [null,'https://tessdata.projectnaptha.com/4.0.0']){
    try{
      const opc=langPath?{logger,langPath,cacheMethod:'none'}:{logger,cacheMethod:'none'}; // sin caché interna: en iPhone puede quedarse colgada
      w=await Promise.race([Tesseract.createWorker('eng',1,opc),new Promise((_,ko)=>setTimeout(()=>ko(new Error('idioma')),30000))]);
      break;
    }catch(e){avance('Probando otro servidor de idioma…')}
  }
  if(!w)throw new Error('idioma');
  const WL='0123456789'+LET;
  try{
    const f=franjaAzul(color.getContext('2d').getImageData(0,0,color.width,color.height).data,color.width,color.height);
    let texto='';
    if(f){
      const crop=recortar(color,f);
      await w.setParameters({tessedit_char_whitelist:WL,tessedit_pageseg_mode:'7'});
      texto=(await w.recognize(crop)).data.text;
      const r=corregir(texto);
      if(r)return{mat:r,texto,crop};
    }
    // Si no se ve la franja azul, se lee la foto entera en blanco y negro.
    const g=color.getContext('2d'),d=g.getImageData(0,0,color.width,color.height),p=d.data;
    for(let i=0;i<p.length;i+=4){const y=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];p[i]=p[i+1]=p[i+2]=y}
    g.putImageData(d,0,0);
    for(const psm of ['11','6']){
      await w.setParameters({tessedit_char_whitelist:WL,tessedit_pageseg_mode:psm});
      texto=(await w.recognize(color)).data.text;
      const r=extraer(texto);
      if(r)return{mat:r,texto};
    }
    return null;
  }finally{await w.terminate()}
}

if(typeof document!=='undefined'){
  const inp=document.getElementById('m'),out=document.getElementById('out'),foto=document.getElementById('foto');
  function mostrar(r,nota){
    out.textContent='';
    const c=document.createElement('div');c.className='card'+(r.err?' err':'');
    const a=document.createElement('p');a.className='year';a.textContent=r.err||r.y;
    const b=document.createElement('p');b.textContent=r.det;
    c.append(a,b);
    if(nota){const n=document.createElement('p');n.className='nota';n.textContent=nota;c.append(n)}
    out.append(c);
  }
  function detalle(res){
    const card=out.firstChild;if(!card)return;
    const p=document.createElement('p');p.className='nota';
    p.textContent='Texto leído: «'+(res.texto||'').trim()+'»'+(res.crop?'. Zona que ha leído:':'');
    card.append(p);
    if(res.crop){res.crop.style.cssText='max-width:100%;height:auto;border-radius:8px;margin-top:8px';card.append(res.crop)}
  }
  function ver(nota){mostrar(analizar(inp.value),nota)}
  document.getElementById('go').addEventListener('click',()=>ver());
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();ver();inp.blur()}});
  document.getElementById('cam').addEventListener('click',()=>foto.click());
  foto.addEventListener('change',async()=>{
    const f=foto.files[0];if(!f)return;
    const avance=t=>mostrar({err:t,det:'La primera vez tarda más, porque descarga el lector (varios MB). No cierres la página.'});
    avance('Empezando…');
    try{
      const res=await Promise.race([leerFoto(f,avance),new Promise((_,ko)=>setTimeout(()=>ko(new Error('tiempo')),150000))]);
      const r=res&&res.mat;
      if(r){inp.value=r;ver('Matrícula leída: '+r+'. Si no coincide con la del coche, corrígela arriba y pulsa «Ver año».');detalle(res)}
      else mostrar({err:'No he podido leerla',det:'Prueba otra vez con la matrícula de frente, bien iluminada y ocupando casi toda la foto. También puedes escribirla a mano.'});
    }catch(e){
      if(e&&e.message==='tiempo')mostrar({err:'Tarda demasiado',det:'La lectura no termina. Comprueba la conexión e inténtalo otra vez, o escribe la matrícula a mano.'});
      else if(e&&e.message==='idioma')mostrar({err:'No consigo descargar el idioma',det:'Ningún servidor ha respondido. Prueba cambiando de wifi a datos del móvil (o al revés), o escribe la matrícula a mano.'});
      else mostrar({err:'No he podido leer la foto',det:'Hace falta conexión a internet para leer fotos. Puedes escribir la matrícula a mano.'});
    }
    foto.value='';
  });
  // Si la página se abre con ?m=TEXTO (por ejemplo desde un Atajo del iPhone), busca la matrícula en ese texto.
  const q=new URLSearchParams(location.search).get('m');
  if(q){
    const r=corregir(q)||extraer(q);
    if(r){inp.value=r;ver('Matrícula recibida del iPhone: '+r+'.')}
    else mostrar({err:'No he encontrado una matrícula',det:'El texto recibido era: «'+q.slice(0,60)+'». Prueba con otra foto o escríbela a mano.'});
  }
}
if(typeof module!=='undefined')module.exports={analizar,extraer,corregir,franjaAzul,R};
</script>
</body>
</html>
